plugins { id "com.android.application" }

android {
    namespace "com.justdoeat.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.justdoeat.app.newversion"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix "" }
        release { minifyEnabled false }
    }
}
